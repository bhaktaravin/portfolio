<div class="certifications-section">
  <h2 class="certifications-title">Certifications</h2>
  <div class="certifications-grid">
    @for (cert of certifications; track cert) {
      <div class="certification-card">
        <div class="certification-content">
          <h3 class="certification-title">{{ cert.title }}</h3>
          <p class="certification-issuer">{{ cert.issuer }}</p>
          @if (cert.date) {
            <p class="certification-date">Issued {{ cert.date }}</p>
          }
          @if (cert.credentialId) {
            <p class="certification-id">Credential ID {{ cert.credentialId }}</p>
          }
          @if (cert.credentialUrl) {
            <a class="btn btn-secondary" [href]="cert.credentialUrl" target="_blank" rel="noopener">Show credential</a>
          }
        </div>
      </div>
    }
  </div>
</div>
