<div class="container">
  <div class="section-header">
    <h2 class="section-title">FAQ</h2>
    <p class="section-subtitle">Common questions before we start a project</p>
  </div>

  <div class="faq-list">
    @for (item of faqItems; track item; let i = $index) {
      <div
        class="faq-item"
        [class.open]="isOpen(i)"
        >
        <button
          type="button"
          class="faq-question"
          (click)="toggle($event, i)"
          [attr.aria-expanded]="isOpen(i)"
          >
          <span>{{ item.question }}</span>
          <span class="faq-chevron" aria-hidden="true">{{ isOpen(i) ? '−' : '+' }}</span>
        </button>
        <div class="faq-answer" [class.open]="isOpen(i)">
          <div class="faq-answer-inner">
            <p>{{ item.answer }}</p>
          </div>
        </div>
      </div>
    }
  </div>
</div>
